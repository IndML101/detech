[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detech"
version = "0.1.0"
description = "DETech (Desktop Environment Technology) - A minimalist, modular Hyprland desktop environment for FreeBSD powered by Lua configs and Python."
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
authors = [
    { name = "DETech Contributors" }
]
keywords = ["freebsd", "hyprland", "wayland", "desktop-environment", "rofi", "waybar", "lua", "ricing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Programming Language :: Python :: 3",
    "Programming Language :: Lua",
]
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
lua = [
    "lupa>=2.0",
]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
detech = "detech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
